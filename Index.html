<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STYLE NEST</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}
header{padding:20px;text-align:center;border-bottom:1px solid #333;position:sticky;top:0;background:#080808;z-index:5}
.logo{font:28px Georgia;letter-spacing:5px}
nav{margin-top:15px}
nav a{color:#ddd;text-decoration:none;margin:0 8px;font-size:13px}
.hero{min-height:560px;padding:100px 7%;display:flex;align-items:center;background:linear-gradient(90deg,#000c,#0003),url("https://images.unsplash.com/photo-1617137968427-85924c800a22?auto=format&fit=crop&w=1600&q=80") center/cover}
.hero h1{font:70px Georgia;margin:15px 0}
.gold{color:#d7b46a}
button{padding:13px 20px;border:0;background:#d7b46a;color:#111;font-weight:bold;cursor:pointer}
section{padding:60px 6%}
h2{font:40px Georgia}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:25px}
.filters button{background:#151515;color:white;border:1px solid #444;border-radius:30px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:#111;border:1px solid #292929;overflow:hidden;transition:.3s}
.card:hover{transform:translateY(-6px);border-color:#d7b46a}
.card img{width:100%;height:330px;object-fit:cover}
.info{padding:15px}
.price{color:#d7b46a;font-weight:bold;margin:10px 0}
.banner{padding:60px;background:linear-gradient(90deg,#000b,#0004),url("https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=1600&q=80") center/cover}
footer{padding:50px 6%;border-top:1px solid #333;color:#999}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:52px}}
@media(max-width:500px){nav{display:none}.grid{grid-template-columns:1fr 1fr;gap:8px}.card img{height:250px}.hero{min-height:500px}.hero h1{font-size:48px}h2{font-size:32px}}
</style>
</head>

<body>

<header>
<div class="logo">STYLE NEST</div>
<nav>

<a href="#shop">JEANS</a>
